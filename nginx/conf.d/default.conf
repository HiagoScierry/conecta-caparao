# Proxy reverso para a aplicação Next.js (serviço "app" no docker-compose).
# server_name "_" = catch-all, aceita acesso direto por IP.
# Quando o domínio estiver definido, troque "_" pelo domínio e siga
# o passo a passo de HTTPS no README (seção Deploy na VPS).
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 20M;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
